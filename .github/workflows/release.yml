name: Release skills

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or verify (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: skill-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify tag checkout
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
      - name: Install tooling
        run: python -m pip install -r requirements.lock
      - name: Check release inputs
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest
      - name: Build final ZIP files
        run: python -m release_tools build --plugin plugin.json --tag "$RELEASE_TAG"
      - name: Publish and verify public release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKILL_RELEASE_UPLOADS_URL: https://uploads.github.com
        run: python -m release_tools publish --tag "$RELEASE_TAG"
      # This step only runs after anonymous downloads match the uploaded bytes.
      - name: Export verified website index
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/website/index.json
          archive: false
          if-no-files-found: error
          retention-days: 90
      - name: Record manual website handoff
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Verified skill release

          Every skill ZIP, mailwebhook-plugin.zip, and the release index are publicly downloadable and verified.
          Download `index.json` from this run's artifact or the release assets.
          Manually publish its contents at the website's `/.well-known/agent-skills/index.json`.
          Preserve any unrelated skills already listed on the website when merging entries.
          The digest belongs to the release ZIP bytes, not an Actions artifact wrapper.
          Download `mailwebhook-plugin.zip` from the release for manual ChatGPT plugin upload.
          The plugin bundle is not included in the website's skill discovery index.
          SUMMARY
